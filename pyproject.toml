[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fugu"
version = "0.1.0"
description = "Coding-oriented LLM orchestrator that learns to coordinate multiple coding models"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.46.0",
    "peft>=0.13.0",
    "trl>=0.12.0",
    "datasets>=3.0.0",
    "bitsandbytes>=0.44.0",
    "accelerate>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "gitpython>=3.1.0",
    "zstandard>=0.23.0",
    "msgpack>=1.0.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
]

[project.scripts]
fugu-collect = "fugu.cli.collect:main"
fugu-train = "fugu.cli.train:main"
fugu-eval = "fugu.cli.eval:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fugu"]

# Map src/ layout so `import fugu` works after `pip install -e .`
[tool.hatch.build.targets.wheel.sources]
"src/fugu" = "fugu"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Works without editable install; VM/CLI still require `pip install -e ".[dev]"`
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
