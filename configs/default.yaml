# Fugu – default configuration
# Override any value via FUGU_ environment variables
# (e.g. FUGU_PLANNER__BASE_MODEL=my-model)

worker:
  qwen_url: "http://localhost:8001/v1"
  gemma_url: "http://localhost:8002/v1"
  ornith_url: "http://localhost:8003/v1"
  timeout: 120.0
  max_tokens: 4096
  temperature: 0.2

repo:
  workspace_dir: "/tmp/fugu_workspaces"
  max_disk_mb: 2048
  cleanup_on_done: true

planner:
  base_model: "Qwen/Qwen2.5-3B-Instruct"
  lora_r: 64
  lora_alpha: 128
  lora_dropout: 0.05
  lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  load_in_4bit: true
  max_seq_length: 4096

training:
  learning_rate: 2.0e-5
  batch_size: 4
  gradient_accumulation_steps: 4
  num_epochs: 3
  warmup_ratio: 0.1
  save_steps: 500
  eval_steps: 250
  output_dir: "outputs/planner"
  max_grad_norm: 1.0
  weight_decay: 0.01
  fp16: false
  bf16: true
  logging_steps: 10

buffer:
  capacity: 100000
  max_size_mb: 512
  storage_dir: "data/buffer"

env:
  max_steps: 20
  test_timeout_seconds: 300
  # SAFETY: do not run real third-party SWE-bench tests on the host.
  # For remote GitHub clones set isolation_mode=docker (Fugu container
  # sandbox — not the official SWE-bench evaluation harness).
  # allow_host_execution=true only for trusted local/mock path repos.
  isolation_mode: host
  allow_host_execution: false
  # Used when isolation_mode=docker. For LiveCodeBench prefer an image with pytest:
  #   docker build -t fugu-py311-pytest - <<'EOF'
  #   FROM python:3.11-slim
  #   RUN pip install --no-cache-dir pytest
  #   EOF
  docker_image: "python:3.11-slim"
  docker_network: "none"
  docker_memory: "4g"
  docker_cpus: "2"
  docker_workdir: "/workspace"
  docker_user: ""
  docker_extra_args: []
